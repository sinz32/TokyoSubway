<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="user-scalable=yes width=device-width" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>도쿄 지하철 실시간 위치</title>
    <link rel="stylesheet" type="text/css" href="./style.css" />
</head>
<body>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
	<link href="https://hangeul.pstatic.net/hangeul_static/css/nanum-barun-gothic.css" rel="stylesheet">

    <!-- title -->
    <div class='title' id='title'>
        <i class="material-icons" id='icon' onclick="openOrClose();">&#xE5D2;</i><span id='title_text'>도쿄 지하철 실시간 위치</span>
    </div>

    <!-- drawer -->
    <div class='drawer' id='drawer'>
        <div><div class='line_list'>
            <div onclick='loadData("A");'>아사쿠사선</div>
            <div onclick='loadData("H");'>히비아선</div>
            <div onclick='loadData("G");'>긴자선</div>
            <div onclick='loadData("M");'>마루노우치선</div>
            <div onclick='loadData("T");'>도자이선</div>
            <div onclick='loadData("I");'>미타선</div>
            <div onclick='loadData("N");'>난보쿠선</div>
            <div onclick='loadData("Y");'>유라쿠초선</div>
            <div onclick='loadData("C");'>치요다선</div>
            <div onclick='loadData("S");'>신주쿠선</div>
            <div onclick='loadData("Z");'>한조몬선</div>
            <div onclick='loadData("E");'>오에도선</div>
            <div onclick='loadData("F");'>후쿠토신선</div>
        </div></div>
    </div>

    <!-- body -->
    <div class='body_outer' id='body_outer'>
        <div class='body'>
            <div id='metro_map'>
                <div style="padding:8px;">상단 왼쪽에 있는 버튼을 눌러서 노선을 선택하세요.</div>
            </div>
        </div>
    </div>

    <!-- footer -->
    <div class='footer'>
        <hr>
        © 2023-2026 SinZ, All rights reserved.
    </div>

    <script src='./script.js'></script>
    <script>
        var isOpened = false;
        function openOrClose(btn){
            isOpened ? closeDrawer() : openDrawer();
        }

        function openDrawer() {
            document.getElementById("drawer").style.width = "60%";
            isOpened = true;
        }

        function closeDrawer() {
            document.getElementById("drawer").style.width = "0";
            isOpened = false;
        }


        if(navigator.userAgent.includes('SinZMetro')) {
            hideTitle();
        }

        function hideTitle() {
            document.getElementById('title').style.display = 'none';
            document.getElementById('body_outer').style.marginTop = '0px';
        }
    </script>
</body>

</html>
